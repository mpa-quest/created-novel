<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>創作ノート</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2F5D8A">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F4F6;--surface:#fff;--ink:#1E2A38;--sub:#5B6877;--line:#D5DBE2;--accent:#2F5D8A;--on:#fff;--soft:#E3ECF5;--up:#3C8D6E;--down:#B4523E;--mid:#8A94A0;--c1:#2F5D8A;--c2:#C2417F;--c3:#B06A10;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141A21;--surface:#1D252E;--ink:#E6EBF0;--sub:#9AA7B5;--line:#34414F;--accent:#7FB0E0;--on:#10202F;--soft:#23384D;--up:#5CC29B;--down:#E58A74;--c1:#7FB0E0;--c2:#F08CB8;--c3:#E8A94B}}
:root[data-theme="dark"]{--bg:#141A21;--surface:#1D252E;--ink:#E6EBF0;--sub:#9AA7B5;--line:#34414F;--accent:#7FB0E0;--on:#10202F;--soft:#23384D;--up:#5CC29B;--down:#E58A74;--c1:#7FB0E0;--c2:#F08CB8;--c3:#E8A94B}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.8 "Zen Maru Gothic","メイリオ",Meiryo,"Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:none;margin:0;padding:20px max(clamp(12px,2.5vw,32px),env(safe-area-inset-right,0px)) 80px max(clamp(12px,2.5vw,32px),env(safe-area-inset-left,0px))}
.title{width:100%;border:0;background:transparent;color:var(--ink);font-family:inherit;font-weight:700;font-size:26px;line-height:1.4;padding:6px 0;border-bottom:2px solid var(--line)}
.title:focus{outline:none;border-color:var(--accent)}
nav{display:flex;gap:4px;overflow-x:auto;margin:14px 0 20px;padding-bottom:2px}
nav button{flex:none;border:0;background:transparent;color:var(--sub);font-family:inherit;font-weight:500;font-size:15px;padding:8px 14px;border-radius:8px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--on)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.f{display:block;margin:0 0 16px}
.f>span{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{resize:vertical;line-height:1.7}
.card{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--mid);border-radius:10px;padding:14px 14px 4px;margin:0 0 14px}
.card.up{box-shadow:inset -6px 0 0 var(--up)}.card.down{box-shadow:inset -6px 0 0 var(--down)}
.card.lv1{background:var(--soft);border-left-color:var(--c1)}.card.lv2{margin-left:14px;border-left-color:var(--c2)}.card.lv3{margin-left:28px;border-left-color:var(--c3)}
.card.lv1 .bar.sb b{color:var(--c1)}.card.lv2 .bar.sb b{color:var(--c2)}.card.lv3 .bar.sb b{color:var(--c3)}
.bar select{width:auto;padding:4px 8px;font-size:14px}
.addrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.xf{margin:0 0 14px}.xh{display:flex;gap:6px;margin-bottom:4px}.xh input{font-size:14px}
.xh button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:inherit;font-weight:500;font-size:14px;border-radius:8px;padding:5px 11px;cursor:pointer}
.xh .armed{background:var(--down);color:#fff;border-color:var(--down)}
.add.sm{margin:0 0 12px;padding:8px}
.imgs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.im{position:relative;display:block}
.im img{display:block;width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.im img.big{width:min(100%,520px);height:auto;cursor:zoom-out}
.im button{position:absolute;top:4px;right:4px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;font-size:13px;padding:1px 7px;cursor:pointer}
.im button.armed{background:var(--down)}
.addimg{position:relative;display:flex;align-items:center;justify-content:center;width:96px;height:96px;border:1px dashed var(--line);border-radius:8px;color:var(--accent);font-size:14px;cursor:pointer}
.addimg input{position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;border:0;cursor:pointer}
.addimg:focus-within{outline:2px solid var(--accent)}
.warn{background:var(--down);color:#fff;border-radius:8px;padding:8px 12px;margin:10px 0;font-size:14px}.warn[hidden]{display:none}
.grp{margin:0 0 26px}.gname{font-weight:700;font-size:17px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 10px}
.ms{max-width:240px}
.sheet{overflow-x:auto;padding-bottom:8px}
.sin{min-width:640px}
.top{position:relative;margin-bottom:14px}
.mtn{position:absolute;left:0;bottom:0;width:100%;height:62%;fill:var(--line);opacity:.55;z-index:0}
.r1{position:relative;z-index:1;display:grid;grid-template-columns:minmax(110px,160px) minmax(0,1fr) minmax(110px,160px);gap:8px;margin-bottom:8px;align-items:stretch}
.tc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;line-height:1.5;min-height:52px;min-width:0;overflow-wrap:anywhere}
.tc.g{background:var(--soft)}
.tc b{display:block;font-size:12px;color:var(--sub);font-weight:500}
.tc span{display:block;white-space:pre-wrap;overflow-wrap:anywhere}
.mut{color:var(--sub);opacity:.75}
.ar{position:relative;display:flex;align-items:center;justify-content:space-between;color:var(--sub);font-size:12px}
.ar::before{content:"";position:absolute;left:10px;right:10px;top:50%;border-top:2px solid var(--sub)}
.ar i{position:relative;font-style:normal}
.pill{position:relative;background:var(--ink);color:var(--bg);border-radius:14px;padding:4px 14px;font-size:13px;max-width:80%;text-align:center;overflow-wrap:anywhere}
.gr{display:grid;gap:6px;margin-bottom:6px}
.bd{background:var(--ink);color:var(--bg);text-align:center;border-radius:6px;padding:8px 4px;font-weight:700}
.bx{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;min-width:0;min-height:76px;overflow-wrap:anywhere;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:inherit;font-size:13px;line-height:1.5;cursor:pointer}
div.bx{cursor:default}
.bx b{font-size:14px;overflow-wrap:anywhere}
.bx em{font-style:normal;color:var(--sub);overflow-wrap:anywhere;white-space:pre-wrap}
.bx i{font-style:normal;font-size:12px;color:var(--accent);margin-top:auto}
.bx.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.bx.ph{border-style:dashed;background:transparent;color:var(--sub)}
.bx.b1{border-left:5px solid var(--c1)}
.bx.b2{background:var(--soft);border-left:5px solid var(--c2)}
.bx.b3{border-left:5px solid var(--c3)}.bx.b3.up{box-shadow:inset -5px 0 0 var(--up)}.bx.b3.down{box-shadow:inset -5px 0 0 var(--down)}
.lvl{margin:10px 0 0 18px;padding-left:12px;border-left:3px solid var(--c2)}
.lvl.l3{margin-left:36px;border-left-color:var(--c3)}
.tag{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.note{color:var(--sub);font-size:13px;margin:16px 0 0}
.sync{font-size:12px;color:var(--sub);margin-top:4px}
.wbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}.wbar select{flex:1;width:auto;min-width:0}
.badge{font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 8px;white-space:nowrap}
.chk label{display:flex;align-items:center;font-size:14px}.chk input{width:auto;margin-right:6px}
.ms2{display:grid;grid-template-columns:minmax(180px,260px) minmax(0,1fr);gap:16px;align-items:start}
.detail{min-width:0}
.side{position:sticky;top:8px;min-width:0}
.list{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;max-height:60vh;overflow:auto}
.li{display:flex;align-items:center;justify-content:space-between;gap:6px;text-align:left;width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:14px;cursor:pointer;overflow-wrap:anywhere}
.li.lh{font-weight:700;margin-top:6px}
.gh{display:flex;gap:4px;align-items:stretch}.gh .li{flex:1;min-width:0}
.tg{flex:none;width:36px;margin-top:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;cursor:pointer;font-family:inherit}
.lh2{font-weight:700;font-size:13px;color:var(--sub);margin:10px 0 2px}
.li.sub{margin-left:14px;width:calc(100% - 14px);font-size:13px}
.li.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.li.on .badge{color:var(--on);border-color:var(--on)}
.side .wbar{flex-direction:column;align-items:stretch}
@media(max-width:640px){.ms2{grid-template-columns:1fr}.side{position:static}.list{max-height:220px}}
.sec{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:inherit;font-weight:500;font-size:14px;border-radius:8px;padding:6px 12px;cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 130px;gap:10px}
@media(max-width:560px){.row,.row3{grid-template-columns:1fr}}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:10px}
.bar b{font-size:15px;margin-right:auto;flex:1 1 11em;min-width:7em;overflow-wrap:anywhere}
.bar button,.bar select,.bar .badge{white-space:nowrap;flex:none}
.bar.sb{margin-bottom:12px}
.bar.sb select{max-width:100%}
.ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:20px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.usage{white-space:pre-wrap;font-size:14px;line-height:1.8;margin-top:8px}
.gwrap{overflow-x:auto}.gp{cursor:pointer}
.ev{display:block;font-size:12px;margin-top:2px;color:var(--sub)}.ev.up{color:var(--up)}.ev.down{color:var(--down)}
.chk1{display:flex;align-items:center;gap:8px;font-size:15px}.chk1 input{width:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:14px;cursor:pointer;background:var(--surface)}.chip input{width:auto;margin:0}
.li .lt{flex:1;min-width:0}.cnt{font-size:12px;color:var(--sub);flex:none}.li.on .cnt{color:var(--on)}.cnt.zero{color:var(--down)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--line)}.dot.d1{background:var(--c3)}.dot.d2{background:var(--up)}
.pbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}.pbar i{display:block;height:100%;background:var(--c1)}
.wsum{font-size:14px;line-height:1.8}
details.msel{position:relative}
details.msel>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:9px 11px;min-height:42px}
details.msel>summary::-webkit-details-marker{display:none}
details.msel>summary::after{content:"▾";margin-left:auto;color:var(--sub);flex:none}
.cpt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
details.msel .menu{position:absolute;left:0;right:0;z-index:6;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.3);padding:6px}
.mlist{max-height:240px;overflow:auto}
.mi{display:flex;align-items:center;gap:8px;padding:8px;border-radius:6px;cursor:pointer;font-size:15px}.mi:hover{background:var(--soft)}.mi input{width:auto;margin:0}.mi[hidden]{display:none}
.mfilter{margin-bottom:6px}
details.aimsd{margin-bottom:12px}details.aimsd>summary{cursor:pointer;color:var(--sub);font-size:13px;margin-bottom:6px}
.dot.dk-ok{background:var(--up)}.dot.dk-warn{background:var(--c3)}.dot.dk-bad{background:var(--down)}
.fsmsg{border-radius:8px;padding:6px 10px;margin-bottom:12px;font-size:14px}.fsmsg.ok{background:rgba(60,141,110,.18);color:var(--up)}.fsmsg.warn{background:rgba(176,106,16,.18);color:var(--c3)}.fsmsg.bad{background:rgba(180,82,62,.18);color:var(--down)}
.rt{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px}.xh select{flex:1;min-width:0}
.fsl{display:flex;flex-wrap:wrap;margin-bottom:4px}.fchip{display:inline-flex;align-items:center;border:1px solid;border-radius:999px;margin:0 6px 6px 0;overflow:hidden}.fchip button{border:0;background:transparent;color:inherit;font:inherit;font-size:14px;padding:3px 10px;cursor:pointer}.fchip .fx{padding:3px 8px 3px 2px}.fk-plant{color:var(--c1)}.fk-pay{color:var(--up)}
.fsadd{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.fsadd select,.fsadd input{flex:1;min-width:0}
.fm{display:block;font-size:12px;color:var(--c1);margin-top:2px}
.ctx{background:var(--bg);border-radius:8px;padding:8px 10px;margin-bottom:12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.ctx b{display:inline-block;min-width:3.5em;color:var(--sub);font-weight:500}
.ph b{font-size:17px}.ph span{color:var(--sub);font-size:13px;margin-right:auto}
.ind1{margin-left:14px;width:calc(100% - 14px);color:var(--c2);border-color:var(--c2)}.ind2{margin-left:28px;width:calc(100% - 28px);color:var(--c3);border-color:var(--c3)}
.sec.c1b{color:var(--c1);border-color:var(--c1)}
.lg{display:inline-block;padding:0 8px;margin-right:4px;border:1px solid;border-radius:999px;font-size:12px}.lg.c1{color:var(--c1)}.lg.c2{color:var(--c2)}.lg.c3{color:var(--c3)}
.bar.sb b{order:2;flex:1 1 100%;margin:6px 0 0}
.bar.sb button:last-of-type{margin-left:auto}
.bar button,.add,.pri{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:inherit;font-weight:500;font-size:14px;border-radius:8px;padding:5px 11px;cursor:pointer}
.add{width:100%;padding:12px;border-style:dashed;color:var(--accent)}
.pri{background:var(--accent);color:var(--on);border-color:var(--accent)}
.bar .armed{background:var(--down);color:#fff;border-color:var(--down)}
.hint{color:var(--sub);font-size:14px;margin:0 0 16px}
.empty{color:var(--sub);text-align:center;padding:28px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="wbar" id="wbar"></div>
  <input class="title" data-p="title" placeholder="作品のタイトル" aria-label="作品のタイトル">
  <div id="sync" class="sync" aria-live="polite"></div>
  <div id="warn" class="warn" hidden>端末内への保存に失敗しました（空き容量不足の可能性があります）。「保存」タブで書き出して控えを取ってください。</div>
  <nav id="tabs" role="tablist"></nav>
  <main id="main"></main>
</div>
<script>
const KEY='sousaku-note-v1';
const blank=()=>({title:'',ov:{logline:'',theme:'',anti:'',tcj:'',want:'',thru:'',goal:'',conflict:'',ending:''},plot:{ki:'',sho:'',ten:'',ketsu:''},pl:{},method:'kisho',scenes:[],chars:[],cg:[],refs:[],fs:[],goal:{pages:'',deadline:''},notes:''});
let S=blank(),tab='ov';
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(blank(),JSON.parse(r))}catch(e){}
const migrate=()=>{S.pl=S.pl||{};(S.scenes||[]).forEach(s=>{if(s.emo!==undefined){if(s.emv===undefined){const m={'＋':5,'－':-5,'±':0};if(m[s.emo]!==undefined)s.emv=m[s.emo]}delete s.emo}});const L0=S.scenes||[];if(L0.some(s=>(s.lv||3)>1&&s.pid===undefined)){let bg='',md='';L0.forEach(s=>{const l=s.lv||3;if(l===1){bg=s.id;md=''}else if(l===2){s.pid=bg;md=s.id}else s.pid=md||bg})}const p=S.plot;if(p&&!S.pl.kisho&&(p.ki||p.sho||p.ten||p.ketsu))S.pl.kisho=[p.ki||'',p.sho||'',p.ten||'',p.ketsu||''];S.chars.forEach(c=>{if(c.flaw){(c.extra=c.extra||[]).push({k:'弱さ・欠点',v:c.flaw})}delete c.flaw})};migrate();
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('sousaku',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const kvGet=async k=>{const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const kvSet=async(k,v)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})};
const kvDel=async k=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})};
const warn=on=>{const w=document.getElementById('warn');if(w)w.hidden=!on};
const defaultWL=()=>({cur:'main',list:[{id:'main',name:''}],series:[]});
let WL=defaultWL();
const persist=()=>{kvSet('S:'+WL.cur,S).then(()=>warn(false)).catch(()=>warn(true))};
const persistWL=()=>{kvSet('WL',WL).catch(()=>warn(true))};
const SK='sousaku-sync-v1',ST={cfg:null,srv:{},dirty:{},up:{},nk:false,del:[]};
try{Object.assign(ST,JSON.parse(localStorage.getItem(SK)||'{}'))}catch(e){}
if(typeof ST.srv!=='object'||ST.srv===null)ST.srv={main:ST.srv||0};
if(typeof ST.dirty!=='object'||ST.dirty===null)ST.dirty={main:!!ST.dirty};
const stSave=()=>{try{localStorage.setItem(SK,JSON.stringify(ST))}catch(e){}};
let SS='未設定',pt=null;
const setStat=t=>{SS=t;['sync','sync2'].forEach(i=>{const e=document.getElementById(i);if(e)e.textContent=t})};
const touch=id=>{if(ST.cfg){ST.dirty[id]=true;stSave();clearTimeout(pt);pt=setTimeout(syncDirty,3000)}};
let pst=null;
const flushPersist=()=>{if(pst){clearTimeout(pst);pst=null;persist()}};
const save=()=>{if(!pst)pst=setTimeout(()=>{pst=null;persist()},400);touch(WL.cur);return true};
const saveWL=()=>{persistWL();touch('index')};
const call=async o=>{const r=await fetch(ST.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({token:ST.cfg.token,id:'main'},o))});return r.json()};
const getData=async id=>id==='index'?{list:WL.list,series:WL.series}:id===WL.cur?S:id.startsWith('sr')?(id===curSid()?SRD:await kvGet('SR:'+id)):await kvGet('S:'+id);
const wname=id=>{const w=WL.list.find(x=>x.id===id);return (w&&w.name)||'（無題）'};
const conflictMsg=id=>'競合：'+(id==='index'?'作品一覧':'「'+wname(id)+'」')+'は別の端末でも更新されています。「保存」タブで選んでください';
const push=async(id,force)=>{id=id||WL.cur;if(!ST.cfg)return;setStat('同期中…');try{const data=await getData(id);if(!data)return;if(id!=='index'&&!(await uploadImgs(data))){setStat('画像の送信に失敗しました（あとで再試行します）');return}const r=await call({id,op:'put',data,base:force?-1:(ST.srv[id]||0)});if(r.ok){ST.srv[id]=r.updated;ST.dirty[id]=false;stSave();setStat('同期済み')}else if(r.error==='conflict')setStat(conflictMsg(id));else setStat('同期エラー：'+r.error)}catch(e){setStat('オフライン（あとで同期します）')}};
const syncDirty=async()=>{if(!ST.cfg)return;await flushDel();for(const id of ['index',...WL.list.map(w=>w.id),...WL.series.map(s=>s.id)])if(ST.dirty[id])await push(id)};
const localHas=async id=>{if(id==='index')return JSON.stringify([WL.list,WL.series])!==JSON.stringify([defaultWL().list,[]]);if(id.startsWith('sr')){if(id===curSid())return JSON.stringify(SRD)!==JSON.stringify(normSR(null));try{return !!(await kvGet('SR:'+id))}catch(e){return false}}if(id===WL.cur)return JSON.stringify(S)!==JSON.stringify(blank());try{return !!(await kvGet('S:'+id))}catch(e){return false}};
const loadCur=async()=>{let d=null;try{d=await kvGet('S:'+WL.cur)}catch(e){}S=d?Object.assign(blank(),d):blank();SEL.chars=0;SEL.cg=-1;SEL.r={sc:'w',gi:0,ii:-1};migrate();await loadSR();applyShared();await migImgs();await loadImgs()};
const applyDoc=async(id,data)=>{
  if(id==='index'){if(data.list&&data.list.length)WL.list=data.list;if(data.series)WL.series=data.series;if(!WL.list.some(w=>w.id===WL.cur)){WL.cur=WL.list[0].id;await loadCur()}else{await loadSR();applyShared()}persistWL();render();return}
  if(id.startsWith('sr')){if(id===curSid()){SRD=normSR(data);persistSR();applyShared();persist();await loadImgs();render()}else await kvSet('SR:'+id,normSR(data));return}
  if(id===WL.cur){S=Object.assign(blank(),data);migrate();applyShared();await migImgs();await loadImgs();persist();render()}
  else await kvSet('S:'+id,Object.assign(blank(),data))};
const pullDoc=async(id,force)=>{if(!ST.cfg)return;setStat('同期中…');try{
  if(!force){const s=await call({id,op:'stat'});if(!s.ok){setStat('同期エラー：'+s.error);return}
    if(s.updated&&s.updated===(ST.srv[id]||0)){if(ST.dirty[id])await push(id);else setStat('同期済み');return}}
  const r=await call({id,op:'get'});if(!r.ok){setStat('同期エラー：'+r.error);return}
  if(!r.data){await push(id,true);return}
  const dirty=ST.dirty[id]||((ST.srv[id]||0)===0&&await localHas(id));
  if(force||(!dirty&&r.updated>(ST.srv[id]||0))){await applyDoc(id,r.data);ST.srv[id]=r.updated;ST.dirty[id]=false;stSave();setStat('同期済み')}
  else if(dirty&&r.updated!==(ST.srv[id]||0))setStat(conflictMsg(id));
  else if(dirty)await push(id);
  else setStat('同期済み')}catch(e){setStat('オフライン（あとで同期します）')}};
const pull=async force=>{if(!ST.cfg)return;await pullDoc('index');if(curSid())await pullDoc(curSid());await pullDoc(WL.cur,force);fetchMissing()};
const flushCur=async()=>{try{await kvSet('S:'+WL.cur,S)}catch(e){}if(ST.cfg&&ST.dirty[WL.cur])await push(WL.cur);const sd=curSid();if(ST.cfg&&sd&&ST.dirty[sd])await push(sd)};

const calcUsage=async()=>{const rows=await kvScan();let img=0,imgN=0,txt=0,upN=0,upB=0;
